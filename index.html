<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude</title>
<script src="https://integrations.missiveapp.com/missive.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --line: #e5e7eb;
    --card: #f8f9fa; --accent: #d97757; --ok: #1a7f37; --err: #cf222e; --run: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1f22; --fg: #e6e6e6; --muted: #9aa0a6; --line: #34363b;
      --card: #26282c; --ok: #3fb950; --err: #f85149; --run: #d29922; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; }
  .conv { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .conv b { color: var(--fg); font-weight: 600; }
  textarea { width: 100%; min-height: 84px; resize: vertical; padding: 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .hint { flex: 1; font-size: 11px; color: var(--muted); }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px;
    font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .banner { display: none; margin-bottom: 8px; padding: 6px 8px; border-radius: 6px; font-size: 12px;
    background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    margin: 16px 0 6px; font-weight: 600; }
  .job { padding: 8px; border-radius: 6px; background: var(--card); margin-bottom: 6px; cursor: pointer; }
  .job:hover { outline: 1px solid var(--line); }
  .job .top { display: flex; gap: 6px; align-items: baseline; }
  .job .subj { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job .st { font-size: 11px; font-weight: 600; }
  .st.queued, .st.running { color: var(--run); }
  .st.done { color: var(--ok); }
  .st.error { color: var(--err); }
  .job .ins { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .job .res { font-size: 12px; margin-top: 4px; }
  .empty { color: var(--muted); font-size: 12px; }
  .box { display: none; margin-bottom: 10px; padding: 8px; border-radius: 6px; background: var(--card);
    font-size: 12px; }
  .box code { display: block; margin: 6px 0; word-break: break-all; font-size: 11px; }
  .box input { width: 100%; margin: 6px 0; padding: 6px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; }
  .manual { display: none; margin-bottom: 6px; }
  .manual input { width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; }
</style>
</head>
<body>
  <div class="banner" id="banner"></div>
  <div class="box" id="setup">
    <b>Jeton de cet ordi</b> (à coller une fois dans le panneau Missive) :
    <code id="setupToken"></code>
    <button id="setupCopy" type="button">Copier</button>
  </div>
  <div class="box" id="pair">
    <b>Première utilisation sur cet ordi.</b> Ouvre <code>http://localhost:4823/</code> dans ton navigateur, copie le jeton et colle-le ici :
    <input id="pairInput" placeholder="Jeton">
    <button id="pairSave" type="button">Enregistrer</button>
  </div>
  <div class="manual" id="manual">
    <input id="manualId" placeholder="Hors Missive : id de conversation (test)">
  </div>
  <div class="conv" id="conv">Ouvre une conversation…</div>
  <textarea id="ins" placeholder="Ta consigne pour Claude (ex. « dis-lui oui pour jeudi, pas avant 14 h »)"></textarea>
  <div class="row">
    <span class="hint">Entrée pour lancer · Maj+Entrée pour une nouvelle ligne</span>
    <button id="go" disabled>Lancer</button>
  </div>

  <h2>Brouillons</h2>
  <div id="jobs"><div class="empty">Rien pour l'instant.</div></div>

<script>
  const LOCAL = 'http://localhost:4823';
  const INJECTED = '__TOKEN__'; // remplacé par le serveur local quand il sert la page
  const servedLocally = !INJECTED.startsWith('__');
  const BASE = servedLocally ? '' : LOCAL;
  const inMissive = typeof window.Missive !== 'undefined' && window.parent !== window;
  const $ = (id) => document.getElementById(id);
  let current = null; // { id, subject }
  let TOKEN = servedLocally ? INJECTED : '';

  // Jeton : dans Missive, gardé avec storeSet (persiste entre les redémarrages).
  function readToken() {
    if (servedLocally) return Promise.resolve(INJECTED);
    if (inMissive) return Missive.storeGet('mc-token').then((t) => t || '');
    try { return Promise.resolve(localStorage.getItem('mc-token') || ''); } catch { return Promise.resolve(''); }
  }
  function saveToken(t) {
    TOKEN = t;
    if (inMissive) return Missive.storeSet('mc-token', t);
    try { localStorage.setItem('mc-token', t); } catch {}
  }

  function api(path, opts = {}) {
    if (!TOKEN) return Promise.reject(Object.assign(new Error('jeton'), { auth: true }));
    return fetch(BASE + path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN, ...(opts.headers || {}) } })
      .then((r) => r.ok ? r.json() : r.json().then((j) => Promise.reject(Object.assign(new Error(j.error || r.status), { auth: r.status === 401 }))));
  }

  function showPairing(show) {
    $('pair').style.display = show ? 'block' : 'none';
  }
  $('pairSave').addEventListener('click', () => {
    const t = $('pairInput').value.trim();
    if (!t) return;
    saveToken(t); $('pairInput').value = ''; showPairing(false); load();
  });

  // Page ouverte directement sur l'ordi (hors Missive) : afficher le jeton à copier.
  if (servedLocally && !inMissive) {
    $('setup').style.display = 'block';
    $('setupToken').textContent = INJECTED;
    $('setupCopy').addEventListener('click', () => navigator.clipboard.writeText(INJECTED).then(() => { $('setupCopy').textContent = 'Copié ✓'; }));
  }

  function setConv(c) {
    current = c;
    $('conv').innerHTML = c ? 'Conversation : <b></b>' : 'Ouvre une conversation…';
    if (c) $('conv').querySelector('b').textContent = c.subject || '(sans sujet)';
    refreshButton();
  }

  function refreshButton() {
    $('go').disabled = !(current && current.id && $('ins').value.trim());
  }

  if (inMissive) {
    Missive.on('change:conversations', (ids) => {
      if (!ids || ids.length !== 1) return setConv(null);
      Missive.fetchConversations(ids).then(([c]) => {
        setConv({ id: c.id, subject: c.subject || (c.latest_message && c.latest_message.subject) || '' });
      });
    }, { retroactive: true });
  } else {
    $('manual').style.display = 'block';
    $('manualId').addEventListener('input', (e) => {
      const v = e.target.value.trim();
      setConv(v ? { id: v, subject: '(test hors Missive)' } : null);
    });
  }

  $('ins').addEventListener('input', refreshButton);
  $('ins').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); launch(); }
  });
  $('go').addEventListener('click', launch);

  function launch() {
    const instruction = $('ins').value.trim();
    if (!current || !instruction) return;
    $('go').disabled = true;
    api('/api/jobs', { method: 'POST', body: JSON.stringify({ conversationId: current.id, subject: current.subject, instruction }) })
      .then(() => { $('ins').value = ''; refreshButton(); load(); $('ins').focus(); })
      .catch((e) => banner('Pas pu lancer : ' + e.message))
      .finally(refreshButton);
  }

  function banner(msg) {
    $('banner').style.display = msg ? 'block' : 'none';
    $('banner').textContent = msg || '';
  }

  const LABEL = { queued: 'En file', running: 'En cours…', done: 'Prêt', error: 'Erreur' };

  function render(list) {
    const box = $('jobs');
    if (!list.length) { box.innerHTML = '<div class="empty">Rien pour l\'instant.</div>'; return; }
    box.innerHTML = '';
    for (const j of list) {
      const el = document.createElement('div');
      el.className = 'job';
      el.innerHTML = '<div class="top"><span class="subj"></span><span class="st"></span></div><div class="ins"></div><div class="res"></div>';
      el.querySelector('.subj').textContent = j.subject || j.conversationId;
      const st = el.querySelector('.st'); st.textContent = LABEL[j.status] || j.status; st.classList.add(j.status);
      el.querySelector('.ins').textContent = '« ' + j.instruction + ' »';
      el.querySelector('.res').textContent = j.result || '';
      el.addEventListener('click', () => { if (inMissive) Missive.navigate({ conversationId: j.conversationId }); });
      box.appendChild(el);
    }
  }

  function load() {
    return api('/api/jobs').then((d) => {
      showPairing(false);
      banner(d.claude ? '' : 'Claude Code introuvable sur cet ordi (voir README).');
      render(d.jobs);
    }).catch((e) => {
      if (e.auth) { banner(''); showPairing(true); }
      else banner('Serveur local injoignable. Lance missive-claude sur cet ordi.');
    });
  }

  readToken().then((t) => { if (!TOKEN) TOKEN = t; load(); setInterval(load, 3000); });
</script>
</body>
</html>
